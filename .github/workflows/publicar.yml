name: Publicar

# Cada vez que se marca una version (git tag v1, v2...) esto compila los
# cinco sistemas y cuelga los paquetes en Releases. Asi no hay que compilar
# a mano ni subir binarios al repositorio.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Las acciones van por el SHA de su commit y no por la etiqueta, y vsce
    # con su version exacta. Este trabajo puede escribir en Releases, y una
    # etiqueta se puede mover: si alguien la apunta a otro codigo, los
    # binarios que se baja la gente saldrian de ahi sin que nadie lo vea.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      # vsce tiene que estar antes de construir: construir.sh empaqueta la
      # extension si lo encuentra a mano, y si no, se la salta en silencio.
      # La 3.9.2 era la ultima cuando se empaqueto la v8.1.
      - name: Preparar vsce para la extension
        run: npm install -g @vscode/vsce@3.9.2

      # Se llama al mismo script que se usa para construir a mano, en vez de
      # repetir aqui lo que hace. Antes estaba copiado, las dos copias se
      # fueron separando y de ahi salio que los paquetes estuvieran meses sin
      # el gastos.csv. Con una sola receta eso no puede volver a pasar.
      #
      # construir.sh ya comprueba el formato, pasa go vet y ejecuta las
      # pruebas antes de compilar nada, asi que esos pasos tampoco hacen
      # falta aqui. GITHUB_REF_NAME es la etiqueta que se esta publicando, y
      # es lo que acaba diciendo "fal --version".
      - name: Construir los paquetes
        run: |
          sh construir.sh
          ls -lh dist/*.zip dist/*.tar.gz dist/*.vsix

      # Las novedades salen de NOVEDADES.md, de la seccion que lleve el
      # nombre de esta etiqueta. Antes el texto estaba escrito aqui y era el
      # mismo para todas las versiones, asi que ninguna contaba que traia.
      # Si no hay seccion para esta etiqueta, se cuelga solo la tabla.
      - name: Preparar el texto de la version
        run: |
          if [ -f NOVEDADES.md ]; then
            awk -v buscada="## $GITHUB_REF_NAME" '
              $0 == buscada { dentro = 1; next }
              /^## / { dentro = 0 }
              dentro { print }
            ' NOVEDADES.md > notas.md
          fi
          touch notas.md
          cat >> notas.md <<'FIN'

          ## Descargar

          Coge el paquete de tu sistema, descomprímelo entero y ejecuta el
          instalador que viene dentro.

          | Sistema | Paquete |
          |---|---|
          | Windows | `fal-windows.zip` |
          | Mac con chip Apple | `fal-mac-apple.tar.gz` |
          | Mac con Intel | `fal-mac-intel.tar.gz` |
          | Linux | `fal-linux.tar.gz` |
          | Linux en ARM | `fal-linux-arm.tar.gz` |

          Y si usas VS Code, `fal-vscode.vsix` colorea los archivos .fal.
          Se instala desde Extensiones, en los tres puntos de arriba,
          con "Install from VSIX".
          FIN
          echo "--- asi quedan las notas ---"
          cat notas.md

      - name: Colgarlos en Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/fal-windows.zip
            dist/fal-mac-apple.tar.gz
            dist/fal-mac-intel.tar.gz
            dist/fal-linux.tar.gz
            dist/fal-linux-arm.tar.gz
            dist/fal-vscode.vsix
          body_path: notas.md
