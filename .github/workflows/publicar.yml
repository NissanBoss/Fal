name: Publicar

# Cada vez que se marca una version (git tag v1, v2...) esto compila los
# cinco sistemas y cuelga los paquetes en Releases. Asi no hay que compilar
# a mano ni subir binarios al repositorio.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Comprobar el formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Analisis estatico
        run: go vet ./...

      - name: Pruebas
        run: go test ./...

      # OJO: esto hace lo mismo que la funcion armar() de construir.sh, que se
      # usa para construir a mano. Si tocas una, toca la otra: de tenerlas
      # descoordinadas salio que los paquetes fueran meses sin gastos.csv.
      - name: Construir los paquetes
        run: |
          mkdir -p dist
          armar() {
            CARPETA="dist/$1"
            mkdir -p "$CARPETA/ejemplos"
            GOOS="$2" GOARCH="$3" go build -trimpath -ldflags "-s -w" -o "$CARPETA/$4" .
            # Todo lo de ejemplos, no solo los .fal: gastos.fal necesita su
            # gastos.csv al lado o falla nada mas descargarlo.
            cp -r ejemplos/. "$CARPETA/ejemplos/"
            rm -f "$CARPETA/ejemplos/"*.svg
            # El banco de pruebas va dentro para que "fal --probar" funcione
            # recien descargado, que es lo que prometen README y manual.
            cp -r pruebas "$CARPETA/"
            cp README.md LEEME.md MANUAL.md NOVEDADES.md LICENSE "$CARPETA/"
          }
          armar fal-windows   windows amd64 fal.exe
          armar fal-mac-apple darwin  arm64 fal
          armar fal-mac-intel darwin  amd64 fal
          armar fal-linux     linux   amd64 fal
          armar fal-linux-arm linux   arm64 fal

          cp instalador/instalar.bat instalador/desinstalar.bat dist/fal-windows/
          for P in fal-mac-apple fal-mac-intel fal-linux fal-linux-arm; do
            cp instalador/instalar.sh "dist/$P/"
            chmod +x "dist/$P/instalar.sh"
          done

          cd dist
          zip -r fal-windows.zip fal-windows
          for P in fal-mac-apple fal-mac-intel fal-linux fal-linux-arm; do
            tar -czf "$P.tar.gz" "$P"
          done
          ls -lh *.zip *.tar.gz

      - name: Empaquetar la extension de VS Code
        run: |
          npm install -g @vscode/vsce
          cd editor/vscode-fal
          vsce package --out ../../dist/fal-vscode.vsix
          ls -lh ../../dist/fal-vscode.vsix

      # Las novedades salen de NOVEDADES.md, de la seccion que lleve el
      # nombre de esta etiqueta. Antes el texto estaba escrito aqui y era el
      # mismo para todas las versiones, asi que ninguna contaba que traia.
      # Si no hay seccion para esta etiqueta, se cuelga solo la tabla.
      - name: Preparar el texto de la version
        run: |
          if [ -f NOVEDADES.md ]; then
            awk -v buscada="## $GITHUB_REF_NAME" '
              $0 == buscada { dentro = 1; next }
              /^## / { dentro = 0 }
              dentro { print }
            ' NOVEDADES.md > notas.md
          fi
          touch notas.md
          cat >> notas.md <<'FIN'

          ## Descargar

          Coge el paquete de tu sistema, descomprímelo entero y ejecuta el
          instalador que viene dentro.

          | Sistema | Paquete |
          |---|---|
          | Windows | `fal-windows.zip` |
          | Mac con chip Apple | `fal-mac-apple.tar.gz` |
          | Mac con Intel | `fal-mac-intel.tar.gz` |
          | Linux | `fal-linux.tar.gz` |
          | Linux en ARM | `fal-linux-arm.tar.gz` |

          Y si usas VS Code, `fal-vscode.vsix` colorea los archivos .fal.
          Se instala desde Extensiones, en los tres puntos de arriba,
          con "Install from VSIX".
          FIN
          echo "--- asi quedan las notas ---"
          cat notas.md

      - name: Colgarlos en Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fal-windows.zip
            dist/fal-mac-apple.tar.gz
            dist/fal-mac-intel.tar.gz
            dist/fal-linux.tar.gz
            dist/fal-linux-arm.tar.gz
            dist/fal-vscode.vsix
          body_path: notas.md
