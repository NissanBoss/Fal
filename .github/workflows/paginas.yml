name: Playground

# Compila el interprete a WebAssembly y publica la pagina donde se puede
# probar Fal sin instalar nada. Se lanza en cada cambio de main.
#
# Para que funcione hay que activarlo una vez en el repositorio:
#   Settings -> Pages -> Source -> GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, que solo se publique el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar a WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o docs/fal.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/
          # Los ejemplos de verdad, para que la pagina pueda ofrecerlos sin
          # llevar una segunda copia dentro del HTML. Solo se publica lo que
          # se sube en este paso, asi que sin esto el playground los pediria
          # y no estarian.
          mkdir -p docs/ejemplos
          cp ejemplos/*.fal docs/ejemplos/
          ls -lh docs/ docs/ejemplos/

      # El manual se fabrica desde MANUAL.md en cada publicacion, para que no
      # haya dos copias del mismo texto separandose poco a poco. El conversor
      # esta en herramientas/manual y no usa ninguna libreria, igual que el
      # resto del proyecto.
      - name: Hacer la pagina del manual
        run: |
          go run ./herramientas/manual MANUAL.md docs/manual.html
          test -s docs/manual.html
          # Si el conversor deja markdown sin convertir, es que ha dejado de
          # entender algo que el manual usa, y eso se ve en la pagina.
          if grep -qE '^\| |^\*\*|^```' docs/manual.html; then
            echo "el manual tiene markdown sin convertir:"
            grep -nE '^\| |^\*\*|^```' docs/manual.html | head
            exit 1
          fi

      # El sitemap lleva la fecha del último commit que tocó cada página, no
      # la de hoy. Generarlo con la fecha del despliegue le diría al buscador
      # que el manual cambió cada vez que se toca cualquier otra cosa, y eso
      # es justo lo que hace que dejen de fiarse del sitemap.
      - name: Hacer el sitemap
        run: |
          fecha() { git log -1 --format=%cs -- "$1" 2>/dev/null || date -I; }
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for par in "/:docs/index.html:1.0" \
                       "/manual.html:MANUAL.md:0.9" \
                       "/probar.html:docs/probar.html:0.8"; do
              ruta="${par%%:*}"; resto="${par#*:}"
              archivo="${resto%%:*}"; peso="${resto#*:}"
              printf '  <url><loc>https://fal-lang.org%s</loc><lastmod>%s</lastmod><priority>%s</priority></url>\n' \
                "$ruta" "$(fecha "$archivo")" "$peso"
            done
            echo '</urlset>'
          } > docs/sitemap.xml
          cat docs/sitemap.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: desplegar
        uses: actions/deploy-pages@v4
